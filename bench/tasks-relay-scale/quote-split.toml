name = "relay-quote-split"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Customers want to split a bill evenly between several payers. Add `Quote.split(parts)`, returning what each of the `parts` payers pays, as a list of Money. Raise ValidationError when parts is less than 1."""
relevant_files = ["tallyho/pricing/quote.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
path_prepend = ["~/bench-work/venv/bin"]
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "../tasks-relay/pool/notes-scale.toml"
relay_pair = "quote-split"

[[local_tests]]
path = "tests/test_relay_quote_split.py"
source = "../tasks-relay/files/test_relay_quote_split.py"

[[dead_end]]
description = "the obvious approach this pair's note warns about"
file_glob = "tallyho/pricing/quote.py"
pattern = '''times\(\s*(Decimal\(\s*)?["']?1["']?\s*\)?\s*/'''
