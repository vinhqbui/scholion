name = "relay-store-count"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Add `count(collection)` to the record store: it returns how many records a collection holds (0 for an unknown one). Every backend (MemoryStore and JsonFileStore) must support it."""
relevant_files = ["tallyho/store/base.py", "tallyho/store/memory.py", "tallyho/store/jsonfile.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
path_prepend = ["~/bench-work/venv/bin"]
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "../tasks-relay/pool/notes-scale.toml"
relay_pair = "store-count"

[[local_tests]]
path = "tests/test_relay_store_count.py"
source = "../tasks-relay/files/test_relay_store_count.py"

[[dead_end]]
description = "the obvious approach this pair's note warns about"
file_glob = "tallyho/store/*.py"
pattern = '''len\(\s*self\.list_page\(|count_records\(\s*self\s*,|iter_records\(\s*self\s*,'''
