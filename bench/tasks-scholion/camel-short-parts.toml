name = "camel-short-parts"
repo_path = "~/bench-repos/scholion-t"
base_rev = "bug-camel"
fix_rev = "main"
goal = """Full-text code search misses identifiers whose camelCase parts are short: a goal that says "url" does not find readUrl, and "http" does not find parseHTTPRequest, although longer parts such as "request" do match. Fix the identifier word splitting so every camelCase part of two characters or more is kept. Run only the tests of the crate you change (`cargo test -p <crate> --lib`): the whole workspace takes many minutes to build and its other tests need services this machine does not have."""
relevant_files = ["crates/scholion-pack/src/lexical.rs"]
verify_cmd = "CARGO_TARGET_DIR=$HOME/bench-work/cargo-target cargo test -q -p scholion-pack --lib --test hidden_lexical"
verify_timeout_secs = 900
max_turns = 40
model = "claude-haiku-5-5"
session_timeout_secs = 1200

[[local_tests]]
path = "crates/scholion-pack/tests/hidden_lexical.rs"
source = "files/hidden_lexical.rs"
