name = "relay-ledger-refund"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Accounting needs refunds booked. Add `Ledger.record_refund(on, order_id, quote)`, which books the refund of a paid order whose sale was booked with record_sale."""
relevant_files = ["tallyho/ledger.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
path_prepend = ["~/bench-work/venv/bin"]
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "pool/notes.toml"
relay_pair = "ledger-refund"

[[local_tests]]
path = "tests/test_relay_ledger_refund.py"
source = "files/test_relay_ledger_refund.py"
