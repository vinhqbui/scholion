name = "relay-line-taxes"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Receipts must show the tax of each order line. Add `line_taxes` to Quote: a list of (sku, tax) pairs, one per taxable order line in order (lines exempt from tax are left out), filled in by quote_order."""
relevant_files = ["tallyho/pricing/quote.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "pool/notes.toml"
relay_pair = "line-taxes"

[[local_tests]]
path = "tests/test_relay_line_taxes.py"
source = "files/test_relay_line_taxes.py"

[[dead_end]]
description = "the obvious approach this pair's note warns about"
file_glob = "tallyho/pricing/quote.py"
pattern = '''taxes\.tax\(\s*(l|ln|line|item|it)\b|taxes\.tax\(\s*\w*line'''
