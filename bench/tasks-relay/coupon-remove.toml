name = "relay-coupon-remove"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """Shops need to withdraw coupons. Add `CouponBook.remove(code)`: afterwards `get` no longer finds that coupon, and removing a code the book does not know does nothing. Staff type the codes in by hand."""
relevant_files = ["tallyho/pricing/coupons.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "pool/notes.toml"
relay_pair = "coupon-remove"

[[local_tests]]
path = "tests/test_relay_coupon_remove.py"
source = "files/test_relay_coupon_remove.py"

[[dead_end]]
description = "the obvious approach this pair's note warns about"
file_glob = "tallyho/pricing/coupons.py"
pattern = '''_by_code(\.pop\(|\[)\s*code\s*[\],)]|(^|[^.\w])code\.upper\(\)'''
