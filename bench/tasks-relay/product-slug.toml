name = "relay-product-slug"
repo_path = "~/bench-repos/tallyho"
base_rev = "main"
goal = """The web shop needs URL slugs for products. Add a read-only `Product.slug` property."""
relevant_files = ["tallyho/models.py"]
verify_cmd = "~/bench-work/venv/bin/python -m pytest -q -p no:cacheprovider tests"
max_turns = 30
model = "deepseek-flash"
session_timeout_secs = 900
relay_pool = "pool/notes.toml"
relay_pair = "product-slug"

[[local_tests]]
path = "tests/test_relay_product_slug.py"
source = "files/test_relay_product_slug.py"
