[package]
name = "margincode-index"
autotests = false
version = "0.0.3"
edition.workspace = true
publish.workspace = true

[dependencies]
margincode-core.workspace = true
margincode-store = { path = "../margincode-store" }
serde.workspace = true
tree-sitter = "0.25"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
async-trait.workspace = true
serde_json.workspace = true
sha2 = "0.10"
sqlx = { workspace = true, features = ["json", "uuid"] }
uuid.workspace = true

[dev-dependencies]
sqlx.workspace = true
margincode-testutil = { path = "../margincode-testutil" }
tokio.workspace = true
proptest = { version = "1.12.0", default-features = false, features = ["std"] }

[[test]]
name = "it"
path = "tests/main.rs"
