[package]
name = "scholion-cli"
version = "0.0.2"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "scholion"
path = "src/main.rs"

# Short alias: same program. Hooks, agent prompts and pack text use `av`.
[[bin]]
name = "av"
path = "src/alias.rs"

[dependencies]
scholion-agentrun = { path = "../scholion-agentrun" }
scholion-core = { path = "../scholion-core" }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }
uuid.workspace = true
toml_edit = "0.22"

[dev-dependencies]
scholion-daemon = { path = "../scholion-daemon" }
scholion-index = { path = "../scholion-index" }
scholion-store = { path = "../scholion-store" }
scholion-testutil = { path = "../scholion-testutil" }
scholion-vcs = { path = "../scholion-vcs" }
axum.workspace = true
tempfile = "3"
tokio.workspace = true

# cargo-binstall: fetch the release archive instead of compiling (names as release.yml builds them).
# The tag is `release/<version>`; the archive holds one directory `scholion-v<version>-<target>/`
# with scholion, av and scholion-daemon. Windows ships a zip with the CLI only.
[package.metadata.binstall]
pkg-url = "https://github.com/vinhqbui/scholion/releases/download/release/{ version }/scholion-v{ version }-{ target }.{ archive-format }"
bin-dir = "scholion-v{ version }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
pkg-fmt = "zip"
