[package]
name = "scholion-cli"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[[bin]]
name = "scholion"
path = "src/main.rs"

# Short alias: same program. Hooks, agent prompts and pack text use `av`.
[[bin]]
name = "av"
path = "src/alias.rs"

[dependencies]
scholion-core = { path = "../scholion-core" }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
ureq = { version = "2", features = ["json"] }
uuid.workspace = true

[dev-dependencies]
scholion-daemon = { path = "../scholion-daemon" }
scholion-index = { path = "../scholion-index" }
scholion-store = { path = "../scholion-store" }
scholion-testutil = { path = "../scholion-testutil" }
scholion-vcs = { path = "../scholion-vcs" }
axum = "0.8"
tempfile = "3"
tokio.workspace = true
