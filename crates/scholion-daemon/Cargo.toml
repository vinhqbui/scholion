[package]
name = "scholion-daemon"
autotests = false
version = "0.0.2"
edition.workspace = true
publish.workspace = true

[lib]
name = "scholion_daemon"
path = "src/lib.rs"

[[bin]]
name = "scholion-daemon"
path = "src/main.rs"

[features]
# Release builds: the Postgres archive is compiled into the daemon, so lite mode never downloads it.
bundled-postgres = ["postgresql_embedded/bundled"]

[dependencies]
scholion-core.workspace = true
scholion-index = { path = "../scholion-index" }
scholion-pack = { path = "../scholion-pack" }
scholion-semantic = { path = "../scholion-semantic" }
scholion-store = { path = "../scholion-store" }
scholion-vcs = { path = "../scholion-vcs" }
axum.workspace = true
chrono.workspace = true
futures.workspace = true
filetime = "0.2"
globset = "0.4"
postgresql_embedded = { version = "0.21", default-features = false, features = ["theseus", "tls-rustls-ring"] }
serde.workspace = true
serde_json.workspace = true
similar = "2"
sha2 = "0.10"
subtle = "2.6"
tower = { version = "0.5", features = ["util"] }
sqlx = { workspace = true, features = ["migrate"] }
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
chrono.workspace = true
scholion-testutil = { path = "../scholion-testutil" }
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[test]]
name = "it"
path = "tests/main.rs"
