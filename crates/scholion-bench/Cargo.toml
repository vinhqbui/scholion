[package]
name = "scholion-bench"
autotests = false
version = "0.0.3"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
clap = { version = "4", features = ["derive", "env"] }
globset = "0.4"
regex = "1"
scholion-agentrun = { path = "../scholion-agentrun" }
scholion-core.workspace = true
scholion-index = { path = "../scholion-index" }
serde.workspace = true
serde_json.workspace = true
tiktoken-rs = "0.9"
toml = "0.8"
ureq = { version = "2", features = ["json"] }
uuid.workspace = true

[dev-dependencies]
scholion-daemon = { path = "../scholion-daemon" }
scholion-store = { path = "../scholion-store" }
scholion-testutil = { path = "../scholion-testutil" }
scholion-vcs = { path = "../scholion-vcs" }
axum.workspace = true
tempfile = "3"
tokio.workspace = true

[[test]]
name = "it"
path = "tests/main.rs"
