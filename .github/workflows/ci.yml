name: ci

on:
  # branch pushes are covered by their pull request; running both doubles the minutes
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Full debug info is ~80% of each ~450 MB test binary and filled the runner's disk; line tables
  # still give file:line in panics and backtraces.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  # Postgres tests use this server instead of downloading an embedded one.
  AV_TEST_DATABASE_URL: postgres://av:av@localhost:5432/postgres
  # Without this the Qdrant tests skip silently; set, they run against the service below.
  AV_TEST_QDRANT_URL: http://localhost:6334

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: av
          POSTGRES_PASSWORD: av
        # TestDb creates a database per test, and tests run in parallel.
        options: >-
          --health-cmd "pg_isready -U av" --health-interval 2s --health-timeout 5s --health-retries 30
        ports:
          - 5432:5432
      qdrant:
        # same pin as deploy/docker-compose.yml
        image: qdrant/qdrant:v1.13.6
        ports:
          - 6333:6333
          - 6334:6334
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Wait for Qdrant
        run: |
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:6333/readyz && exit 0
            sleep 2
          done
          echo "qdrant did not become ready" >&2
          exit 1
      - name: Test
        # all crates even after a failure; the service Postgres sorts text en_US (not C), which
        # catches orderings that depend on the database locale
        run: cargo test --workspace --no-fail-fast
