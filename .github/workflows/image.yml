name: image

# Builds ghcr.io/vinhqbui/scholion on each release tag (the same tags as release.yml) and pushes it as
# <version> and latest. Not built on pull requests. Uses the built-in GITHUB_TOKEN only.

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. release/0.0.2
        required: true

permissions:
  contents: read
  packages: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/vinhqbui/scholion

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Version from the tag
        id: ver
        run: |
          # release/0.1.0 -> 0.1.0 and v0.1.0 -> 0.1.0: an image tag may not contain a slash
          ver="${TAG#release/}"; ver="${ver#v}"
          echo "version=$ver" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            FEATURES=scholion-daemon/bundled-postgres
          # the bundling build script lists Postgres releases through the GitHub API
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.ver.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
