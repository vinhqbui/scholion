name: release

# Push a tag like v0.1.0 (or release/0.1.0) to build the CLI (`scholion` and its alias `av`) for
# Linux and macOS and publish them, with SHA-256 sums, as a GitHub release. The daemon still runs
# from deploy/docker-compose.yml.

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked -p scholion-cli --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          # release/0.1.0 -> v0.1.0: a tag may contain a slash, a file name may not
          ver="${TAG#release/}"; ver="v${ver#v}"
          name="scholion-${ver}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/scholion target/${{ matrix.target }}/release/av \
             LICENSE README.md "$name/"
          tar czf "$name.tar.gz" "$name"
          shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: scholion-*.tar.gz*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" scholion-*.tar.gz* --clobber
          else
            gh release create "$TAG" scholion-*.tar.gz* --generate-notes --title "Scholion ${TAG#release/}"
          fi
