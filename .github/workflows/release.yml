name: release

# Push a tag like v0.1.0 (or release/0.1.0) to build the CLI (`margincode` and its alias `av`) and
# `margincode-daemon` for Linux and macOS and publish them, with SHA-256 sums, as a GitHub release.
# Windows gets the CLI only (`margincode.exe`, `av.exe` in a zip), to talk to a daemon elsewhere
# (Docker, WSL, another machine): the daemon stays Linux and macOS.
# The daemon carries its own Postgres (lite mode, `av up`); deploy/docker-compose.yml still works.

on:
  push:
    tags: ['v*', 'release/*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to (re)build, e.g. v0.1.0
        required: true

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}
  # Lite mode's Postgres is compiled into margincode-daemon (feature bundled-postgres); keep the
  # major in step with crates/margincode-daemon/src/embedded_pg.rs.
  POSTGRESQL_VERSION: "^16"
  # the bundling build script lists the Postgres releases through the GitHub API
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, cli_only: true }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup toolchain install && rustup target add ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.cli_only }}" = true ]; then
            cargo build --release --locked --target ${{ matrix.target }} -p margincode-cli
          else
            cargo build --release --locked --target ${{ matrix.target }} \
              -p margincode-cli -p margincode-daemon --features margincode-daemon/bundled-postgres
          fi
      - name: Package
        shell: bash
        run: |
          # release/0.1.0 -> v0.1.0: a tag may contain a slash, a file name may not
          ver="${TAG#release/}"; ver="v${ver#v}"
          name="margincode-${ver}-${{ matrix.target }}"
          mkdir "$name"
          bins="margincode av"
          [ "${{ matrix.cli_only }}" = true ] || bins="$bins margincode-daemon"
          exe=""
          [ "${{ runner.os }}" = Windows ] && exe=".exe"
          for bin in $bins; do
            cp "target/${{ matrix.target }}/release/$bin$exe" "$name/"
          done
          cp LICENSE README.md "$name/"
          if [ "${{ runner.os }}" = Windows ]; then
            archive="$name.zip"
            7z a -tzip "$archive" "$name" >/dev/null
          else
            archive="$name.tar.gz"
            tar czf "$archive" "$name"
          fi
          # same "hash  file" line either way; Git Bash on Windows has sha256sum, macOS shasum
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            margincode-*.tar.gz*
            margincode-*.zip*

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" margincode-*.tar.gz* margincode-*.zip* --clobber
          else
            gh release create "$TAG" margincode-*.tar.gz* margincode-*.zip* --generate-notes --title "Margincode ${TAG#release/}"
          fi
