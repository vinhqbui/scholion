name: av-main-pr

# The Scholion foundry (a standing Scholion Cloud cell that develops Scholion) pushes its merged work
# to the branch av-main. This workflow opens ONE pull request from av-main to main when none is
# open, so a human can review and merge it. It never merges anything.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".
# A pull request opened with the built-in token does not start the `ci` workflow by itself; push an
# empty commit to av-main or close and reopen the pull request to run it. Uses GITHUB_TOKEN only.

on:
  push:
    branches: [av-main]

permissions:
  pull-requests: write
  contents: read

concurrency:
  group: av-main-pr
  cancel-in-progress: false

jobs:
  open-pr:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Open the av-main pull request when none is open
        run: |
          open="$(gh pr list --head av-main --base main --state open --json number --jq 'length')"
          if [ "$open" != "0" ]; then
            echo "A pull request from av-main is already open; nothing to do."
            exit 0
          fi
          cat > "$RUNNER_TEMP/body.md" <<'BODY'
          This branch is the Scholion foundry's trunk: the work of agents, merged through av with a review
          and a human gate. Each task's `av notes` comment on this pull request carries its records
          (decisions, dead ends, findings), so the reasoning is here and not only the diff.

          **Merge it with a merge commit.** Do not squash and do not rebase: the foundry's history and
          `main` must reconverge, and a squash or rebase leaves the next `av-main` pull request built on
          commits `main` no longer has.

          The foundry never merges `main` itself. Review the diff, check the records, and merge it yourself.
          BODY
          gh pr create --base main --head av-main \
            --title "Foundry: av-main" \
            --body-file "$RUNNER_TEMP/body.md"
